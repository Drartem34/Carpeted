# --- Carpeted -------------------------------------------------------------
# Rug on the desktop (layer-shell, under all windows):
exec-once = carpeted

# One rug per monitor:
# exec-once = carpeted --output DP-1
# exec-once = carpeted --output HDMI-A-1

# Keep your wallpaper (hyprpaper/swww) and put only the rug on top of it:
# exec-once = carpeted --floor none

# Handy binds (layer surfaces get no keyboard, so control it from here):
bind = SUPER SHIFT, R, exec, carpeted --shake     # shake out / flatten the rug
# bind = SUPER CTRL, R, exec, carpeted --reset    # put it back in the middle

# --- Alternative: the rug as a "secret stash" scratchpad ---------------------
# exec-once = [workspace special:rug silent; float; size 80% 80%; center] carpeted --window --desktop-dir ~/Stash
# bind = SUPER, R, togglespecialworkspace, rug
