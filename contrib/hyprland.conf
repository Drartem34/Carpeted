# --- Carpeted ----------------------------------------------------------------
exec-once = carpeted                               # tiny daemon, ~1 MB of its own memory

bind = SUPER, R, exec, carpeted toggle             # roll the rug out / back in
bind = SUPER SHIFT, R, exec, carpeted stash-window # put the active window on the rug

# Optional, cosmetic: the rug animates itself, so skip Hyprland's own layer
# animation for it.  If your Hyprland version rejects this line, just delete it.
layerrule = noanim, carpeted
