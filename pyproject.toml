[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carpeted"
version = "0.1.0"
description = "A rug with real cloth physics on your Wayland (Hyprland) desktop. Hide files under it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# PyGObject, pycairo, PyOpenGL and numpy are best taken from the distro
# (see README) because PyGObject must match the system GTK.
dependencies = []

[project.scripts]
carpeted = "carpeted.__main__:main"

[tool.setuptools]
packages = ["carpeted"]
